<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kelime Defterim</title>
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#161a2b;--mut:#6b7186;--line:#e4e6f0;--pri:#4f46e5;--pri2:#eef0ff;--ok:#16a34a;--ok2:#e7f7ec;--no:#dc2626;--no2:#fdecec;--amb:#d97706;--amb2:#fff4e0}
@media(prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#1a1e31;--tx:#eef0fa;--mut:#9aa0b8;--line:#2a2f47;--pri:#818cf8;--pri2:#262b4d;--ok:#4ade80;--ok2:#143222;--no:#f87171;--no2:#3a1a1c;--amb:#fbbf24;--amb2:#3a2c10}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.4}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
#view{max-width:560px;margin:0 auto;padding:16px 16px calc(84px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:140px;padding:9px 0 8px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pri);font-weight:600}
h1{font-size:24px;margin:4px 0 2px}h2{font-size:17px;margin:22px 0 10px}
.mut{color:var(--mut)}.sm{font-size:13px}.ctr{text-align:center}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--pri);color:#fff;border-radius:14px;padding:13px 18px;font-weight:600;min-height:48px}
@media(prefers-color-scheme:dark){.btn{color:#0f1220}}
.btn.sec{background:var(--pri2);color:var(--pri)}.btn.ghost{background:none;color:var(--mut);font-weight:500}
.btn.wide{width:100%}.btn.smb{padding:8px 14px;min-height:38px;border-radius:11px;font-size:14px}
.btn:disabled{opacity:.4}
.step{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.num{width:34px;height:34px;border-radius:50%;background:var(--pri2);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.num.done{background:var(--ok2);color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:16px;padding:14px;text-align:left;display:block;width:100%}
.tile b{display:block;margin-bottom:2px}.tile span{font-size:13px;color:var(--mut)}
.tile:disabled{opacity:.45}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:8px}
.streak{background:var(--amb2);color:var(--amb);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.seg button{padding:8px 14px;border-radius:999px;background:var(--card);color:var(--mut);font-size:14px;white-space:nowrap}
.seg button.on{background:var(--pri);color:#fff;font-weight:600}
@media(prefers-color-scheme:dark){.seg button.on{color:#0f1220}}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);margin:10px 0;outline:none}
.wrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.wrow:first-child{border-top:0}
.wrow b{font-size:16px}.dots{display:flex;gap:3px;margin-top:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.f{background:var(--ok)}
.spk{width:42px;height:42px;border-radius:50%;background:var(--pri2);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;flex:none}
.spk svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spk.rec{background:var(--no2);color:var(--no)}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--pri);color:var(--pri);font-weight:700;text-align:center}
.area{width:100%;min-height:150px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;outline:none}
.spk.big{width:84px;height:84px}.spk.big svg{width:38px;height:38px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--pri2);color:var(--pri);font-weight:600}
.chart{display:flex;align-items:flex-end;gap:4px;height:110px;margin-top:8px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:1px}
.chart i{width:100%;border-radius:4px 4px 0 0;display:block}.chart i.n{background:var(--pri)}.chart i.r{background:var(--ok);border-radius:0}
.chart span{font-size:9px;color:var(--mut);margin-top:3px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field select,.field input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
/* oturum */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.hidden{display:none!important}
.stop{display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
.stop .bar{flex:1}.x{font-size:26px;line-height:1;color:var(--mut);width:36px;height:36px}
.sbody{flex:1;overflow-y:auto;padding:8px 20px 20px;max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column}
.sfoot{padding:12px 20px calc(16px + env(safe-area-inset-bottom));max-width:560px;width:100%;margin:0 auto}
.qlabel{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.word{font-size:40px;font-weight:800;margin:10px 0 2px;word-break:break-word}
.okn{font-size:20px;color:var(--pri);font-weight:600}
.mean{font-size:24px;font-weight:700;margin:14px 0 4px}
.ex{background:var(--card);border-radius:14px;padding:12px 14px;margin-top:14px}
.ex p{margin:0}.ex p+p{color:var(--mut);margin-top:4px;font-size:15px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:15px 16px;text-align:left;font-size:17px;min-height:56px}
.opt.ok{border-color:var(--ok);background:var(--ok2)}.opt.no{border-color:var(--no);background:var(--no2)}
.tin{width:100%;font-size:24px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);margin-top:22px;outline:none;text-align:center}
.tin:focus{border-color:var(--pri)}
.fb{border-radius:16px;padding:14px 16px;margin-bottom:10px}.fb.ok{background:var(--ok2)}.fb.no{background:var(--no2)}
.fb h3{margin:0 0 4px;font-size:16px}.fb.ok h3{color:var(--ok)}.fb.no h3{color:var(--no)}
.note{width:100%;border:1px dashed var(--line);background:transparent;border-radius:12px;padding:10px 12px;margin-top:14px;min-height:46px;resize:none;outline:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:18px 20px calc(22px + env(safe-area-inset-bottom))}
ol.tips{padding-left:20px;margin:6px 0}ol.tips li{margin:9px 0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:50;font-size:14px;max-width:90%}
</style>
</head>
<body>
<main id="view"></main>
<nav id="nav">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Bugün</button>
  <button data-tab="words"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21a2 2 0 0 0 2 2h13v-4"/><path d="M9 8h6"/></svg>Kelimeler</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>İlerleme</button>
  <button data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.3l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2.3-1.3L14 3h-4l-.3 2.5a7 7 0 0 0-2.3 1.3l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .9.1 1.3l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2.3 1.3L10 21h4l.3-2.5a7 7 0 0 0 2.3-1.3l2.3 1 2-3.4-2-1.5c.1-.4.1-.9.1-1.3z"/></svg>Ayarlar</button>
</nav>
<div id="ses" class="overlay hidden">
  <div class="stop"><button class="x" onclick="quitSession()" aria-label="Kapat">×</button><div class="bar"><i id="sbar"></i></div><span id="scount" class="sm mut"></span></div>
  <div class="sbody" id="sbody"></div>
  <div class="sfoot" id="sfoot"></div>
</div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<script src="words.js"></script>
<script>
'use strict';
/* ---------- yardımcılar ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jq=s=>esc(String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)};
const dayStr=(n,o)=>new Date(n*864e5).toLocaleDateString('tr-TR',Object.assign({timeZone:'UTC',day:'numeric',month:'short'},o||{}));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
const SPK='<svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const POS={'n.':'isim','v.':'fiil','adj.':'sıfat','adv.':'zarf','prep.':'edat','conj.':'bağlaç','pron.':'zamir','det.':'belirleyici','exclam.':'ünlem','number':'sayı','modal v.':'kip fiili','auxiliary v.':'yardımcı fiil','indefinite article':'belirsiz tanımlık','definite article':'belirli tanımlık','infinitive marker':'mastar eki'};
const trPos=p=>p.split(/\s*[,\/]\s*/).map(x=>POS[x]||x).join(', ');

/* ---------- kelime verisi ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const LEVELS=['A1','A2','B1','B2'];
const W=[];const B={};
(function(){
  const raw=window.WORDS||[];
  LEVELS.forEach((lv,li)=>{
    const part=raw.filter(r=>r[0]===lv).map(r=>{
      const m=r[1].match(/^(.*?)\s*\((.*)\)$/);
      const head=(m?m[1]:r[1]).replace('™','');
      return{id:lv+':'+r[1],lv,w:r[1],head,hint:m?m[2]:'',pos:r[2],tr:r[3],ok:r[4],ex:r[5],ext:r[6],mn:r[7]||''};
    });
    const r=rng(1000+li);
    for(let i=part.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[part[i],part[j]]=[part[j],part[i]]}
    part.forEach(w=>{W.push(w);B[w.id]=w});
  });
})();

const lvName=l=>l==='ME'?'Benim':l;
function syncCustom(){
  for(let i=W.length-1;i>=0;i--)if(W[i].lv==='ME'){delete B[W[i].id];W.splice(i,1)}
  (S.custom||[]).slice().reverse().forEach(c=>{const w={id:'ME:'+c.w,lv:'ME',w:c.w,head:c.w,hint:'',pos:'',tr:c.tr,ok:c.ok||'',ex:c.ex||'',ext:c.ext||''};W.unshift(w);B[w.id]=w});
}
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function clozeM(w){if(!w.ex||w.head.includes(','))return null;const m=w.ex.match(new RegExp('(^|[^A-Za-z])('+reEsc(w.head)+"(?:s|es|d|ed|ing)?)(?![A-Za-z'])",'i'));return m?{i:m.index+m[1].length,t:m[2]}:null}
/* ---------- durum ---------- */
const KEY='kelime-defterim-v1';
const IV=[0,1,2,4,8,16,35,75,150]; // kutu -> gün aralığı
const LEARNED=5;
let S=load();syncCustom();fixToday();
function fixToday(){ // bugün öğrenilip aynı gün ileri basamağa atlamış kelimeleri yarına geri al
  const t=today();for(const id in S.cards){const c=S.cards[id];if(c.t===t&&c.b>1){c.b=1;c.d=t+1}}
}
function load(){
  let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  s=s||{};s.cards=s.cards||{};s.log=s.log||{};
  s.set=Object.assign({daily:20,accent:'en-US',rate:0.9,remH:20,remM:0},s.set||{});
  s.tn=s.tn||{day:today(),ids:[]};s.custom=s.custom||[];s.exams=s.exams||[];
  if(!s.m1){if(s.best)delete s.best.speed;s.m1=1} // eski hızlı tur rekoru aynı kelimelerle yapılmıştı: bir kez sıfırla
  return s;
}
function save(){
  if(S.tn.day!==today())S.tn={day:today(),ids:[]};
  localStorage.setItem(KEY,JSON.stringify(S));
  pushState();
}
function pushState(){ // servis çalışanının hatırlatma için okuyacağı özet
  if(!('caches' in window))return;
  const t=today(),l=S.log[t];
  const body=JSON.stringify({lastDay:l&&(l.n+l.r)>0?t:lastActiveDay(),remH:S.set.remH,remM:S.set.remM,due:dueCards(t+1).length});
  caches.open('kelime-state').then(c=>c.put('state.json',new Response(body))).catch(()=>{});
}
function lastActiveDay(){let m=0;for(const d in S.log){const l=S.log[d];if(l.n+l.r>0&&+d>m)m=+d}return m}
function logAdd(k){const d=today();const l=S.log[d]=S.log[d]||{n:0,r:0,ok:0,no:0};l[k]++}
const dueCards=(t=today())=>Object.keys(S.cards).filter(id=>B[id]&&S.cards[id].d<=t).sort((a,b)=>S.cards[a].d-S.cards[b].d);
const errs=c=>c.s-c.c;
const isHard=c=>c.f||c.l>=2||errs(c)>=3;
const hardIds=()=>Object.keys(S.cards).filter(id=>B[id]&&isHard(S.cards[id])).sort((a,b)=>errs(S.cards[b])-errs(S.cards[a]));
const SEP='\u0001';
function confPairs(){
  const m={};
  for(const id in S.cards){if(!B[id])continue;const cf=S.cards[id].cf||{};for(const o in cf){if(!B[o]||!S.cards[o])continue;const k=[id,o].sort().join(SEP);m[k]=(m[k]||0)+cf[o]}}
  return Object.entries(m).filter(e=>e[1]>=2).sort((a,b)=>b[1]-a[1]).map(([k,n])=>[...k.split(SEP),n]);
}
function cfs(w){ // bu kelimeyle karıştırılanlar (iki yönlü)
  const m={},c=S.cards[w.id];
  if(c&&c.cf)for(const o in c.cf)m[o]=c.cf[o];
  for(const id in S.cards){const cf=S.cards[id].cf;if(cf&&cf[w.id])m[id]=(m[id]||0)+cf[w.id]}
  return Object.keys(m).sort((a,b)=>m[b]-m[a]).map(id=>B[id]).filter(x=>x&&x.id!==w.id&&x.head!==w.head&&x.tr!==w.tr).slice(0,2);
}
function counts(){let learning=0,learned=0,hard=0;for(const id in S.cards){if(!B[id])continue;const c=S.cards[id];c.b>=LEARNED?learned++:learning++;if(isHard(c))hard++}return{learning,learned,hard,total:learning+learned}}
function streak(){let t=today(),n=0;const act=d=>S.log[d]&&S.log[d].n+S.log[d].r>0;if(!act(t))t--;while(act(t)){n++;t--}return n}
function nextNew(n){const out=[];for(const w of W){if(!S.cards[w.id]){out.push(w);if(out.length>=n)break}}return out}
function grade(id,ok){
  const c=S.cards[id];
  if(ok){
    if(c.t===today()||c.g===today())c.d=Math.max(c.d,today()+1); // bugün öğrenildi ya da bugün zaten değerlendirildi: basamak atlamaz
    else{c.b=Math.min(8,c.b+1);c.d=today()+IV[c.b]+(c.b>=5?Math.floor(Math.random()*3):0)}
  }
  else{c.l++;c.b=Math.max(1,Math.floor(c.b/2));c.d=today()+1}
  c.g=today();
}

/* ---------- ses ---------- */
let voices=[];
if('speechSynthesis' in window){const lv=()=>{voices=speechSynthesis.getVoices();try{if(tab==='set'&&!ses&&document.activeElement.tagName!=='SELECT')render()}catch(e){}};lv();speechSynthesis.onvoiceschanged=lv}
const LANGN={'en-US':'Amerikan','en-GB':'İngiliz','en-AU':'Avustralya','en-IN':'Hindistan','en-CA':'Kanada','en-IE':'İrlanda','en-ZA':'Güney Afrika','en-NZ':'Yeni Zelanda','en-NG':'Nijerya'};
const enVoices=()=>voices.filter(v=>/^en([-_]|$)/i.test(v.lang)).sort((a,b)=>a.lang.localeCompare(b.lang)||a.name.localeCompare(b.name));
const voiceLabel=v=>{const l=v.lang.replace('_','-');return (LANGN[l]||l)+' · '+v.name.replace(/^(Microsoft|Google)\s+/,'').replace(/\s*-\s*English.*$/,'')};
function setVoice(v){S.set.voice=v;save();speak('Hello! This is my voice. Nice to meet you.')}
function speak(t,slow){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();speechSynthesis.speak(mkUtter(t,slow));
}
function mkUtter(t,slow){
  const u=new SpeechSynthesisUtterance(t);u.lang=S.set.accent;
  const en=enVoices(),sv=S.set.voice;let v=null;
  if(sv==='*'&&en.length)v=en[Math.floor(Math.random()*en.length)];
  else if(sv)v=voices.find(x=>x.name===sv);
  if(!v)v=voices.find(x=>x.lang.replace('_','-')===S.set.accent);
  if(v){u.voice=v;u.lang=v.lang}
  u.pitch=S.set.pitch||1;
  u.rate=slow?0.5:S.set.rate;return u;
}
const canSpeak='speechSynthesis' in window;
const say=(id,slow)=>speak(B[id].head.replace(',',' ,'),slow);
const sayEx=id=>speak(B[id].ex);

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const MIC='<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
let rec=null;
function stopRec(){if(rec){try{rec.onend=null;rec.abort()}catch(e){}rec=null}const b=$('#micb');if(b)b.classList.remove('rec')}
function listen(){
  if(!ses||ses.answered||!SR)return;
  if(canSpeak)speechSynthesis.cancel();
  stopRec();
  const st=$('#spst'),btn=$('#micb'),w=B[ses.cur.id];let msg='';
  rec=new SR();rec.lang=S.set.accent;rec.maxAlternatives=5;rec.interimResults=false;
  rec.onresult=e=>{
    const alts=[...e.results[0]].map(a=>norm(a.transcript)),acc=w.head.split(/,\s*/).map(norm);
    if(alts.some(a=>acc.some(x=>(' '+a+' ').includes(' '+x+' '))))answer(true);
    else msg='Şunu duydum: "'+alts[0]+'". Önce dinle, sonra tekrar dene.';
  };
  rec.onerror=e=>{msg={'not-allowed':'Mikrofon izni gerekli. Tarayıcı sorduğunda izin ver.','service-not-allowed':'Mikrofon izni gerekli.','no-speech':'Ses duyulmadı. Tekrar dene.','network':'Konuşma tanıma için internet gerekli.','audio-capture':'Mikrofon bulunamadı.'}[e.error]||'Anlaşılamadı. Tekrar dene.'};
  rec.onend=()=>{rec=null;if(btn)btn.classList.remove('rec');if(st&&ses&&!ses.answered)st.textContent=msg||'Ses duyulmadı. Tekrar dene.'};
  try{rec.start();btn.classList.add('rec');st.textContent='Dinliyorum… şimdi söyle'}catch(e){st.textContent='Mikrofon başlatılamadı.'}
}

function wordList(){
  const q=wquery.trim().toLocaleLowerCase('tr');
  let a=W;
  if(wfilter==='learning')a=a.filter(w=>S.cards[w.id]&&S.cards[w.id].b<LEARNED);
  else if(wfilter==='learned')a=a.filter(w=>S.cards[w.id]&&S.cards[w.id].b>=LEARNED);
  else if(wfilter==='hard')a=a.filter(w=>S.cards[w.id]&&isHard(S.cards[w.id]));
  else if(wfilter==='today')a=a.filter(w=>S.tn.ids.includes(w.id));
  else if(wfilter==='new')a=a.filter(w=>!S.cards[w.id]);
  else if(wfilter==='mine')a=a.filter(w=>w.lv==='ME');
  if(q)a=a.filter(w=>w.head.toLowerCase().includes(q)||w.tr.toLocaleLowerCase('tr').includes(q));
  if(wfilter!=='new'&&wfilter!=='all'&&wfilter!=='mine')a=a.slice().sort((x,y)=>S.cards[x.id].d-S.cards[y.id].d);
  return a;
}

  const c=counts(),tabs=[['learning','Öğreniyorum '+c.learning],['learned','Öğrendim '+c.learned],['hard','Zor '+c.hard],['today','Bugün '+S.tn.ids.length],['mine','Benim '+S.custom.length],['new','Sırada'],['all','Tümü']];

function addCustom(){

  $('#addta').value.split('\n').forEach(l=>{

    if(p.length<2||!p[0]||!p[1]){skip++;return}
    const w=p[0].replace(/\s+/g,' ');
    if(S.custom.some(c=>c.w.toLowerCase()===w.toLowerCase())){skip++;return}
    S.custom.push({w,tr:p[1],ex:p[2]||'',ext:''});n++;

function vStats(){
  const t=today(),c=counts();let ok=0,no=0,days=0;
  for(const d in S.log){ok+=S.log[d].ok;no+=S.log[d].no;if(S.log[d].n+S.log[d].r>0)days++}
  const last=[];for(let i=13;i>=0;i--)last.push([t-i,S.log[t-i]||{n:0,r:0}]);
  const mx=Math.max(10,...last.map(([,l])=>l.n+l.r));
  const fc=[];for(let i=0;i<=7;i++)fc.push([t+i,Object.keys(S.cards).filter(id=>B[id]&&(i?S.cards[id].d===t+i:S.cards[id].d<=t)).length]);
  const later=Object.keys(S.cards).filter(id=>B[id]&&S.cards[id].d>t+7).length;
  const fm=Math.max(5,...fc.map(x=>x[1]));
  const boxes=[1,2,3,4,5,6,7,8].map(b=>Object.keys(S.cards).filter(id=>B[id]&&S.cards[id].b===b).length),bm=Math.max(1,...boxes);
  return `<h1>İlerleme</h1>
  <div class="stats"><div class="stat"><b>🔥 ${streak()}</b><span>Gün serisi</span></div><div class="stat"><b>${c.total}</b><span>Görülen kelime</span></div><div class="stat"><b>${ok+no?Math.round(100*ok/(ok+no)):0}%</b><span>Doğruluk</span></div></div>
  <div class="stats" style="margin-top:10px"><div class="stat"><b>${c.learning}</b><span>Öğreniyorum</span></div><div class="stat"><b>${c.learned}</b><span>Öğrendim</span></div><div class="stat"><b>${days}</b><span>Çalışılan gün</span></div></div>
  <div class="card"><b>Son 14 gün</b><div class="mut sm"><span style="color:var(--pri)">■</span> yeni &nbsp;<span style="color:var(--ok)">■</span> tekrar</div>
    <div class="chart">${last.map(([d,l])=>`<div><i class="n" style="height:${90*l.n/mx}%"></i><i class="r" style="height:${90*l.r/mx}%"></i><span>${new Date(d*864e5).getUTCDate()}</span></div>`).join('')}</div></div>

function startNew(){
  let left=S.set.daily-S.tn.ids.length;
  if(left<=0)left=10;
  const ws=nextNew(left);const queue=[];
  for(let g=0;g<ws.length;g+=5){
    const grp=ws.slice(g,g+5);
    grp.forEach(w=>queue.push(q('intro',w.id)));
    shuffle(grp).forEach(w=>queue.push(q('mc_en_tr',w.id)));
    shuffle(grp).forEach(w=>queue.push(q('mc_tr_en',w.id)));
  }
  shuffle(ws).forEach(w=>queue.push(q('type',w.id)));
  startSession({mode:'learn',queue,title:'Yeni kelimeler'});
}
function typeFor(id){
  const b=S.cards[id].b,r=Math.random();
  if(b<=1)return r<.5?'mc_en_tr':'mc_tr_en';
  if(b===2)return r<.25?'mc_tr_en':r<.5?'cloze':r<.7&&canSpeak?'listen_mc':'type';
  return r<.45?'type':r<.65&&canSpeak?'listen_type':r<.85?'cloze':'mc_tr_en';
}

function weakPool(n,f){
  const ids=Object.keys(S.cards).filter(id=>B[id]&&(!f||f(S.cards[id])));
  return ids.map(id=>{const c=S.cards[id];return[id,Math.random()*(1+c.l)*(10-c.b)]}).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>x[0]);
}

  const ids=hardIds().sort((a,b)=>(S.cards[a].hi||0)-(S.cards[b].hi||0)).slice(0,6),queue=[];

function distract(w){
  const tm=new Set(w.tr.split(/,\s*/)),mp=w.pos.split(/[,\/]/)[0].trim();
  const pool=W.filter(x=>x.id!==w.id&&x.head!==w.head&&!x.tr.split(/,\s*/).some(m=>tm.has(m)));
  let a=pool.filter(x=>x.lv===w.lv&&x.pos.split(/[,\/]/)[0].trim()===mp);
  const seenA=a.filter(x=>S.cards[x.id]);if(seenA.length>=6)a=seenA;
  if(a.length<3)a=pool;
  const out=[],heads=new Set(),trs=new Set();
  for(const x of [...cfs(w),...shuffle(a)]){if(heads.has(x.head)||trs.has(x.tr))continue;heads.add(x.head);trs.add(x.tr);out.push(x);if(out.length===3)break}
  return out;
}

  }else if(it.type==='listen_mc'){

      :`<div class="qlabel">İngilizcesini yaz</div><div class="mean" style="font-size:30px">${esc(w.tr)}</div><div class="mut sm">${esc(trPos(w.pos))}${w.hint?' · '+esc(w.hint):''}</div>`)
      +`<input class="tin" id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="…"><div class="ctr mut" id="hint" style="margin-top:10px;letter-spacing:.2em;min-height:24px"></div>`;
    foot.innerHTML=`<button class="btn wide" onclick="checkType()">Kontrol et</button><div class="row" style="margin-top:6px"><button class="btn ghost grow" onclick="showHint()">İpucu</button><button class="btn ghost grow" onclick="answer(false)">Bilmiyorum</button></div>`;

function pick(btn){
  if(ses.answered)return;
  const ok=btn.dataset.ok==='1';
  document.querySelectorAll('.opt').forEach(b=>{if(b.dataset.ok==='1')b.classList.add('ok')});
  if(!ok){btn.classList.add('no');ses.conf=btn.dataset.id}
  answer(ok);
}
const norm=s=>s.toLowerCase().replace(/[’`´]/g,"'").replace(/\s+/g,' ').replace(/[.!?]+$/,'').trim();
function checkType(){
  if(ses.answered)return;
  const v=norm($('#tin').value);if(!v){$('#tin').focus();return}
  const w=B[ses.cur.id],acc=w.head.split(/,\s*/).map(norm);
  // dinlemede sesteş kelime yazıldıysa da kabul et
  const homo=ses.cur.type==='listen_type'&&W.some(x=>norm(x.head)===v&&x.ok===w.ok);
  const ok=acc.includes(v)||homo;
  if(!ok){const o=W.find(x=>norm(x.head)===v&&x.id!==w.id);if(o)ses.conf=o.id}
  answer(ok);
}
function showHint(){const h=B[ses.cur.id].head.split(/,\s*/)[0];$('#hint').textContent=h[0]+h.slice(1).replace(/[^ ]/g,' _');$('#tin').focus()}
function answer(ok){
  if(ses.answered)return;ses.answered=true;
  const it=ses.cur,w=B[it.id],first=!ses.seen.has(it.id);ses.seen.add(it.id);
  if(ses.mode==='learn'&&!S.cards[w.id]){S.cards[w.id]={b:1,d:today()+1,l:0,s:0,c:0,t:today()};if(notes[w.id])S.cards[w.id].n=notes[w.id];if(S.tn.day!==today())S.tn={day:today(),ids:[]};S.tn.ids.push(w.id);logAdd('n')}
  const c=S.cards[w.id];c.s++;if(ok)c.c++;
  if(!ok){c.lw=today();if(ses.conf&&B[ses.conf]&&ses.conf!==w.id){c.cf=c.cf||{};c.cf[ses.conf]=(c.cf[ses.conf]||0)+1}}
  ses.conf=null;
  if(first&&!it.re){
    if(ses.mode==='review')grade(w.id,ok);
    else if((ses.mode==='quick'||ses.mode==='exam')&&!ok){c.l++;c.b=Math.max(1,c.b-1);c.d=today()}
    if(ses.mode!=='learn')logAdd('r');
  }
  if(!it.re){logAdd(ok?'ok':'no');ok?ses.ok++:ses.no++}
  stopRec();const bl=$('#blank');if(bl)bl.textContent=bl.dataset.t;
  if(!ok){ses.missed.add(w.id);if(!it.noRe&&ses.mode!=='exam')ses.queue.splice(Math.min(ses.queue.length,ses.i+4),0,{type:it.type,id:it.id,re:true})}
  save();
  const tin=$('#tin');if(tin){tin.disabled=true;tin.style.borderColor=ok?'var(--ok)':'var(--no)'}
  $('#sfoot').innerHTML=`<div class="fb ${ok?'ok':'no'}"><h3>${ok?'✓ Doğru':'✗ Doğrusu şöyle'}</h3><div class="row"><div class="grow"><b style="font-size:19px">${esc(w.head)}</b> <span class="okn" style="font-size:15px">${esc(w.ok)}</span><div>${esc(w.tr)}</div>${ok?'':`<div class="sm mut" style="margin-top:4px">${esc(w.ex)}</div>${c.n||w.mn?`<div class="sm" style="margin-top:4px">💡 ${esc(c.n||w.mn)}</div>`:''}`}</div>${canSpeak?`<button class="spk" onclick="say('${jq(w.id)}')">${SPK}</button>`:''}</div></div><button class="btn wide" onclick="next()">Devam</button>`;
  if(it.type!=='mc_en_tr'&&it.type!=='listen_mc'||!ok)say(w.id);
  if(ok)autoT=setTimeout(next,1500);
}
function next(){clearTimeout(autoT);stopRec();if(!ses)return;ses.i++;renderItem()}
function finish(){
  save();
  const tot=ses.ok+ses.no,pct=tot?Math.round(100*ses.ok/tot):100,min=Math.max(1,Math.round((Date.now()-ses.t0)/6e4));
  const more=ses.mode==='review'&&dueCards().length;
  let msg0={learn:'Bu kelimeler yarın ilk tekrarına gelecek. Uyumadan önce "Akşam tekrarı"nı yapmayı unutma.',review:more?`Hâlâ ${more} tekrar bekliyor.`:'Bugünün tekrarları bitti. Yarın görüşürüz!',quick:'Yanlış yaptıkların tekrar listesine eklendi.',free:'Güzel. Bu kelimeler yarın tekrar karşına çıkacak.'}[ses.mode];
  if(ses.msg)msg0=ses.msg;
  if(ses.hardStep){S.hd=today();ses.seen.forEach(id=>{if(S.cards[id])S.cards[id].hi=today()})}
  if(ses.mode==='exam'){
    S.exams.push({d:today(),ok:ses.ok,n:tot,miss:[...ses.missed].map(id=>B[id].head)});
    msg0='Sonucun: '+ses.ok+' / '+tot+'. Yanlış yaptıkların tekrar listesine eklendi.';
  }
  save();
  $('#sbody').innerHTML=`<div class="ctr" style="margin-top:36px"><div style="font-size:64px">${pct>=80?'🎉':'💪'}</div><h1>${esc(ses.title)} tamam</h1><p class="mut">${msg0}</p></div>
  <div class="stats"><div class="stat"><b>${ses.seen.size}</b><span>Kelime</span></div><div class="stat"><b>${pct}%</b><span>Doğruluk</span></div><div class="stat"><b>${min} dk</b><span>Süre</span></div></div>
  ${ses.missed.size?`<div class="card"><b>Zorlandıkların</b>${[...ses.missed].map(id=>`<div class="wrow"><div class="grow"><b>${esc(B[id].head)}</b> <span class="mut sm">${esc(B[id].ok)}</span><div class="mut sm">${esc(B[id].tr)}</div></div>${canSpeak?`<button class="spk" onclick="say('${jq(id)}')">${SPK}</button>`:''}</div>`).join('')}</div>`:''}`;
  $('#sfoot').innerHTML=(ses.mode==='exam'&&navigator.share?'<button class="btn sec wide" style="margin-bottom:8px" onclick="shareExam()">Sonucu paylaş</button>':'')+(more?'<button class="btn wide" onclick="endSession();startReview()">Tekrarlara devam et</button>':'')+`<button class="btn ${more?'ghost':''} wide" onclick="endSession()">Bitir</button>`;
}

/* ---------- etkinlikler ---------- */
let act=null;
function mark(id,ok){const c=S.cards[id];if(!c)return;c.s++;if(ok)c.c++;else c.lw=today();logAdd('r');logAdd(ok?'ok':'no')}
function pickIds(n,f){ // öğrenilen kelimeler sırayla döner: en uzun süredir hiçbir etkinlikte çıkmayan önce gelir
  const ids=Object.keys(S.cards).filter(id=>B[id]&&(!f||f(B[id]))).map(id=>[id,(S.cards[id].u||0)+Math.random()*.9]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
  const out=[],h=new Set(),t=new Set();
  for(const id of ids){const w=B[id],k=w.head.toLowerCase();if(h.has(k)||t.has(w.tr))continue;h.add(k);t.add(w.tr);out.push(id);if(out.length>=n)break}
  S.uc=(S.uc||0)+1;out.forEach(id=>{S.cards[id].u=S.uc});
  return shuffle(out);
}
function openAct(a){
  if(act){clearInterval(act.tick);clearTimeout(act.to)}
  if(canSpeak)speechSynthesis.cancel();
  act=a;const b=$('#sbody');b.ontouchstart=b.ontouchend=null;b.scrollTop=0;
  $('#ses').classList.remove('hidden');$('#sfoot').innerHTML='';
}
function endAct(){
  if(!act)return;clearInterval(act.tick);clearTimeout(act.to);if(canSpeak)speechSynthesis.cancel();
  if(act.wl)try{act.wl.release()}catch(e){}
  const b=$('#sbody');b.ontouchstart=b.ontouchend=null;
  act=null;$('#ses').classList.add('hidden');save();render();
}
function actBar(i,n,txt){$('#sbar').style.width=(100*i/n)+'%';$('#scount').textContent=txt==null?i+'/'+n:txt}
function actNext(fn){clearTimeout(act.to);act.i++;fn()}
const fbHtml=(ok,l1,l2)=>`<div class="fb ${ok?'ok':'no'}"><h3>${ok?'✓ Doğru':'✗ Doğrusu şöyle'}</h3><b style="font-size:18px">${esc(l1)}</b><div class="sm mut">${esc(l2||'')}</div></div>`;
function actDone(title,emoji,stats,note,again){
  clearInterval(act.tick);clearTimeout(act.to);save();actBar(1,1,'');
  const b=$('#sbody');b.ontouchstart=b.ontouchend=null;
  b.innerHTML=`<div class="ctr" style="margin-top:36px"><div style="font-size:64px">${emoji}</div><h1>${title}</h1><p class="mut">${note||''}</p></div><div class="stats" style="grid-template-columns:repeat(${stats.length},1fr)">${stats.map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>`;
  $('#sfoot').innerHTML=`<button class="btn wide" onclick="${again}()">Tekrar oyna</button><button class="btn ghost wide" onclick="endAct()">Bitir</button>`;
}
const need=(ids,n,msg)=>{if(ids.length<n){toast(msg||'Bu etkinlik için biraz daha kelime öğrenmelisin');return true}return false};

/* 1. Eşleştirme */
function startMatch(){
  const ids=pickIds(6);if(need(ids,6))return;
  openAct({k:'match',ids,left:shuffle(ids),right:shuffle(ids),done:new Set(),sel:null,err:0,t0:Date.now()});
  act.tick=setInterval(()=>{if(act&&act.k==='match')$('#scount').textContent=Math.floor((Date.now()-act.t0)/1000)+' sn'},500);
  $('#scount').textContent='0 sn';drawMatch();
}
function drawMatch(bad){
  const a=act;$('#sbar').style.width=(100*a.done.size/6)+'%';
  const cell=(id,side)=>{const d=a.done.has(id),sel=a.sel===id&&side==='L',b=bad&&bad[side]===id;
    return `<button class="opt ${d?'ok':''} ${b?'no':''}" style="${sel?'border-color:var(--pri);background:var(--pri2);':''}${d?'opacity:.45;':''}padding:10px 12px;font-size:15px;min-height:66px" ${d?'disabled':''} onclick="tapMatch('${jq(id)}','${side}')">${esc(side==='L'?B[id].head:B[id].tr)}</button>`};
  $('#sbody').innerHTML=`<div class="qlabel">Soldan kelimeyi, sağdan anlamını seç</div><div class="grid2" style="margin-top:14px;align-items:start"><div class="opts" style="margin:0">${a.left.map(id=>cell(id,'L')).join('')}</div><div class="opts" style="margin:0">${a.right.map(id=>cell(id,'R')).join('')}</div></div>`;
}
function tapMatch(id,side){
  const a=act;
  if(side==='L'){a.sel=id;say(id);drawMatch();return}
  if(!a.sel){toast('Önce soldan bir kelime seç');return}
  if(a.sel===id){
    a.done.add(id);mark(id,true);a.sel=null;drawMatch();
    if(a.done.size===6){
      const sec=Math.max(1,Math.round((Date.now()-a.t0)/1000));S.best=S.best||{};const rec=!S.best.match||sec<S.best.match;if(rec)S.best.match=sec;
      actDone('Eşleştirme tamam',a.err?'💪':'🎉',[[sec+' sn','Süre'],[a.err,'Hata'],[S.best.match+' sn','En iyi süren']],rec?'Yeni rekor!':'','startMatch');
    }
  }else{a.err++;mark(a.sel,false);const bad={L:a.sel,R:id};a.sel=null;drawMatch(bad);a.to=setTimeout(()=>{if(act===a)drawMatch()},600)}
}

/* 2. Cümle kurma */
const hasEx=w=>{if(!w.ex||!w.ext)return false;const n=w.ex.split(' ').length;return n>=3&&n<=9};
const chipSt='display:inline-block;min-height:0;padding:9px 13px;margin:4px;font-size:17px';
function startBuild(){
  const ids=pickIds(6,hasEx);if(need(ids,3,'Önce örnek cümlesi olan birkaç kelime öğren (A1 ve A2 kelimeleri)'))return;
  openAct({k:'build',ids,i:0,ok:0});nextBuild();
}
function nextBuild(){
  const a=act;if(a.i>=a.ids.length)return actDone('Cümle kurma tamam',a.ok===a.ids.length?'🎉':'💪',[[a.ok+' / '+a.ids.length,'Doğru cümle']],'','startBuild');
  const w=B[a.ids[a.i]];a.tok=w.ex.replace(/[.!?]+$/,'').split(' ');a.ans=[];a.locked=false;
  do{a.pool=shuffle(a.tok.map((t,i)=>i))}while(a.tok.length>2&&a.pool.every((v,i)=>v===i));
  actBar(a.i,a.ids.length);drawBuild();
}
function drawBuild(){
  const a=act,w=B[a.ids[a.i]],chip=(i,fn)=>`<button class="opt" style="${chipSt}" onclick="${fn}(${i})">${esc(a.tok[i])}</button>`;
  $('#sbody').innerHTML=`<div class="qlabel">Kelimeleri sıraya dizerek cümleyi kur</div><div class="mean" style="font-size:22px">${esc(w.ext)}</div>
  <div class="ex" style="min-height:104px">${a.ans.map(i=>chip(i,'unBuild')).join('')||'<span class="mut">Aşağıdaki kelimelere sırayla dokun</span>'}</div>
  <div class="ctr" style="margin-top:18px">${a.pool.filter(i=>!a.ans.includes(i)).map(i=>chip(i,'addBuild')).join('')}</div>`;
  if(!a.locked)$('#sfoot').innerHTML=`<button class="btn wide" ${a.ans.length===a.tok.length?'':'disabled'} onclick="checkBuild()">Kontrol et</button>`;
}
function addBuild(i){if(act.locked)return;act.ans.push(i);drawBuild()}
function unBuild(i){if(act.locked)return;act.ans=act.ans.filter(x=>x!==i);drawBuild()}
function checkBuild(){
  const a=act,w=B[a.ids[a.i]];a.locked=true;
  const ok=a.ans.map(i=>a.tok[i]).join(' ')===a.tok.join(' ');mark(w.id,ok);if(ok)a.ok++;speak(w.ex);
  $('#sfoot').innerHTML=fbHtml(ok,w.ex,w.ext)+'<button class="btn wide" onclick="actNext(nextBuild)">Devam</button>';
}

/* 3. Harf dizme */
const spellOK=w=>/^[A-Za-z]{3,10}$/.test(w.head);
function startSpell(){
  const ids=pickIds(8,spellOK);if(need(ids,4))return;
  openAct({k:'spell',ids,i:0,ok:0});nextSpell();
}
function nextSpell(){
  const a=act;if(a.i>=a.ids.length)return actDone('Harf dizme tamam',a.ok===a.ids.length?'🎉':'💪',[[a.ok+' / '+a.ids.length,'İlk denemede doğru']],'','startSpell');
  const w=B[a.ids[a.i]];a.let=w.head.toLowerCase().split('');a.ans=[];a.tries=0;a.locked=false;
  let g=0;do{a.pool=shuffle(a.let.map((t,i)=>i))}while(g++<20&&a.pool.map(i=>a.let[i]).join('')===a.let.join(''));
  actBar(a.i,a.ids.length);drawSpell();
}
function drawSpell(){
  const a=act,w=B[a.ids[a.i]],tile=(i,fn)=>`<button class="opt" style="display:inline-block;min-height:0;width:44px;padding:9px 0;margin:3px;font-size:22px;text-align:center;font-weight:700" onclick="${fn}(${i})">${esc(a.let[i])}</button>`;
  $('#sbody').innerHTML=`<div class="qlabel">Harfleri sıraya dizerek kelimeyi yaz</div><div class="mean" style="font-size:28px">${esc(w.tr)}</div><div class="mut sm">${esc(trPos(w.pos))}${w.hint?' · '+esc(w.hint):''}</div>
  <div class="ex ctr" style="min-height:76px">${a.ans.map(i=>tile(i,'unSpell')).join('')||'<span class="mut">Harflere sırayla dokun</span>'}</div>
  <div class="ctr" style="margin-top:18px">${a.pool.filter(i=>!a.ans.includes(i)).map(i=>tile(i,'addSpell')).join('')}</div>`;
  if(!a.locked)$('#sfoot').innerHTML=`<div class="row">${canSpeak?`<button class="btn ghost grow" onclick="say('${jq(w.id)}')">🔊 Dinle</button>`:''}<button class="btn ghost grow" onclick="giveUpSpell()">Bilmiyorum</button></div>`;
}
function unSpell(i){if(act.locked)return;act.ans=act.ans.filter(x=>x!==i);drawSpell()}
function addSpell(i){
  const a=act,w=B[a.ids[a.i]];if(a.locked)return;a.ans.push(i);
  if(a.ans.length<a.let.length){drawSpell();return}
  if(a.ans.map(i=>a.let[i]).join('')===a.let.join('')){
    a.locked=true;mark(w.id,a.tries===0);if(a.tries===0)a.ok++;say(w.id);drawSpell();
    $('#sfoot').innerHTML=fbHtml(true,w.head+' · '+w.ok,w.tr)+'<button class="btn wide" onclick="actNext(nextSpell)">Devam</button>';
    a.to=setTimeout(()=>{if(act===a)actNext(nextSpell)},1400);
  }else{a.tries++;if(a.tries>=2){drawSpell();giveUpSpell()}else{toast('Olmadı, bir daha dene');a.ans=[];drawSpell()}}
}
function giveUpSpell(){
  const a=act,w=B[a.ids[a.i]];if(a.locked)return;a.locked=true;mark(w.id,false);say(w.id);
  $('#sfoot').innerHTML=fbHtml(false,w.head+' · '+w.ok,w.tr)+'<button class="btn wide" onclick="actNext(nextSpell)">Devam</button>';
}

/* 4. Hızlı tur */
function startSpeed(){
  if(need(Object.keys(S.cards).filter(id=>B[id]),6))return;
  openAct({k:'speed',score:0,miss:0,end:Date.now()+60000,last:null});
  act.tick=setInterval(()=>{const a=act;if(!a||a.k!=='speed')return;const left=Math.max(0,a.end-Date.now());actBar(left,60000,Math.ceil(left/1000)+' sn');if(left<=0)endSpeed()},200);
  nextSpeed();
}
let spDeck=[];
function speedId(last){ // öğrenilen tüm kelimeler karıştırılır; hepsi bitmeden hiçbiri tekrar gelmez
  for(let g=0;g<3;g++){
    while(spDeck.length){const id=spDeck.pop();if(B[id]&&S.cards[id]&&id!==last)return id}
    spDeck=shuffle(Object.keys(S.cards).filter(id=>B[id]));
  }
  return last;
}
function nextSpeed(){
  const a=act,id=pickIds(1,w=>w.id!==a.last)[0]||a.last,w=B[id];a.cur=id;a.last=id;a.locked=false;
  $('#sbody').innerHTML=`<div class="row" style="margin-top:6px"><div class="qlabel grow" style="margin:0">Türkçesi hangisi?</div><span class="tag">${a.score} doğru</span></div><div class="word">${esc(w.head)}</div><div class="okn">${esc(w.ok)}</div>
  <div class="opts">${shuffle([w,...distract(w)]).map(o=>`<button class="opt" data-ok="${o.id===w.id?1:0}" onclick="tapSpeed(this)">${esc(o.tr)}</button>`).join('')}</div>`;
}
function tapSpeed(btn){
  const a=act;if(a.locked)return;a.locked=true;const ok=btn.dataset.ok==='1';mark(a.cur,ok);
  if(ok){a.score++;nextSpeed();return}
  a.miss++;btn.classList.add('no');document.querySelectorAll('#sbody .opt').forEach(b=>{if(b.dataset.ok==='1')b.classList.add('ok')});
  a.to=setTimeout(()=>{if(act===a&&Date.now()<a.end)nextSpeed()},800);
}
function endSpeed(){
  const a=act;S.best=S.best||{};const rec=a.score>(S.best.speed||0);if(rec)S.best.speed=a.score;
  actDone('Süre doldu',rec?'🏆':'⏱️',[[a.score,'Doğru'],[a.miss,'Yanlış'],[S.best.speed||0,'Rekorun']],rec&&a.score?'Yeni rekor!':'','startSpeed');
}

/* 5. Doğru mu yanlış mı */
function startTF(){
  const ids=pickIds(15);if(need(ids,6))return;
  openAct({k:'tf',ids,i:0,ok:0});nextTF();
}
function nextTF(){
  const a=act;if(a.i>=a.ids.length)return actDone('Tur tamam',a.ok>=a.ids.length*.8?'🎉':'💪',[[a.ok+' / '+a.ids.length,'Doğru karar']],'','startTF');
  const w=B[a.ids[a.i]];a.truth=Math.random()<.5;a.locked=false;
  const o=a.truth?w:(cfs(w)[0]||distract(w)[0]||w);if(o===w)a.truth=true;a.shown=o.tr;
  actBar(a.i,a.ids.length);
  const b=$('#sbody');
  b.innerHTML=`<div class="qlabel">Bu anlam doğru mu?</div><div class="card ctr" style="margin-top:22px;padding:30px 16px"><div class="word" style="margin:0">${esc(w.head)}</div><div class="okn">${esc(w.ok)}</div><div class="mut" style="margin:14px 0 4px">anlamı</div><div class="mean" style="margin:0">${esc(a.shown)}</div></div><div class="ctr mut sm">Sola kaydır: yanlış · Sağa kaydır: doğru</div>`;
  b.ontouchstart=e=>{a.x=e.touches[0].clientX};
  b.ontouchend=e=>{if(a.x==null)return;const dx=e.changedTouches[0].clientX-a.x;a.x=null;if(Math.abs(dx)>70)ansTF(dx>0)};
  $('#sfoot').innerHTML='<div class="grid2"><button class="btn sec" style="color:var(--no)" onclick="ansTF(false)">✗ Yanlış</button><button class="btn sec" style="color:var(--ok)" onclick="ansTF(true)">✓ Doğru</button></div>';
  say(w.id);
}
function ansTF(v){
  const a=act;if(!a||a.k!=='tf'||a.locked)return;a.locked=true;const w=B[a.ids[a.i]],ok=v===a.truth;mark(w.id,ok);
  if(ok){a.ok++;$('#sfoot').innerHTML=fbHtml(true,w.head,w.tr);a.to=setTimeout(()=>{if(act===a)actNext(nextTF)},650)}
  else $('#sfoot').innerHTML=fbHtml(false,w.head+' = '+w.tr,a.truth?'Gösterilen anlam doğruydu.':'Gösterilen anlam yanlıştı.')+'<button class="btn wide" onclick="actNext(nextTF)">Devam</button>';
}

/* 6. Dikte */
const dn=s=>s.toLowerCase().replace(/[’`´]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
function startDict(){
  const ids=pickIds(5,hasEx);if(need(ids,3,'Önce örnek cümlesi olan birkaç kelime öğren (A1 ve A2 kelimeleri)'))return;
  openAct({k:'dict',ids,i:0,ok:0});nextDict();
}
function nextDict(){
  const a=act;if(a.i>=a.ids.length)return actDone('Dikte tamam',a.ok===a.ids.length?'🎉':'💪',[[a.ok+' / '+a.ids.length,'Doğru cümle']],'','startDict');
  const w=B[a.ids[a.i]];a.locked=false;actBar(a.i,a.ids.length);
  $('#sbody').innerHTML=`<div class="qlabel">Cümleyi dinle ve yaz</div><div class="ctr" style="margin:22px 0 4px"><button class="spk big" onclick="sayEx('${jq(w.id)}')">${SPK}</button><div style="margin-top:10px"><button class="btn ghost smb" onclick="speak(B['${jq(w.id)}'].ex,1)">🐢 Yavaş dinle</button></div></div>
  <textarea class="tin" id="din" rows="2" style="font-size:19px;text-align:left;resize:none" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Duyduğun cümle…"></textarea>`;
  $('#sfoot').innerHTML='<button class="btn wide" onclick="checkDict()">Kontrol et</button><button class="btn ghost wide" onclick="checkDict(1)">Bilmiyorum</button>';
  sayEx(w.id);
}
function checkDict(skip){
  const a=act,w=B[a.ids[a.i]];if(a.locked)return;const v=$('#din').value;
  if(!skip&&!v.trim()){$('#din').focus();return}
  a.locked=true;const ok=!skip&&dn(v)===dn(w.ex);mark(w.id,ok);if(ok)a.ok++;$('#din').disabled=true;$('#din').style.borderColor=ok?'var(--ok)':'var(--no)';
  $('#sfoot').innerHTML=fbHtml(ok,w.ex,w.ext)+'<button class="btn wide" onclick="actNext(nextDict)">Devam</button>';
}

/* 7. Eller serbest dinleme */
function startHF(){
  const ids=pickIds(30);
  if(need(ids,1))return;
  openAct({k:'hf',ids,i:0,paused:false,gen:0});
  if(navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>{if(act&&act.k==='hf')act.wl=l;else l.release()}).catch(()=>{});
  playHF();
}
function sayQ(text,lang,slow,cb){
  const a=act;let u,done=false;
  if(lang==='tr'){u=new SpeechSynthesisUtterance(text);u.lang='tr-TR';const v=voices.find(x=>/^tr/i.test(x.lang));if(v)u.voice=v}
  else u=mkUtter(text,slow);
  const fin=()=>{if(done)return;done=true;clearTimeout(t);if(act===a&&!a.paused)a.to=setTimeout(cb,650)};
  const t=setTimeout(fin,12000);u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);
}
function playHF(){
  const a=act;if(!a||a.k!=='hf'||a.paused)return;
  if(a.i>=a.ids.length)return actDone('Dinleme bitti','🎧',[[a.ids.length,'Kelime dinlendi']],'','startHF');
  const w=B[a.ids[a.i]],g=++a.gen,en=w.head.replace(',',' ,');
  actBar(a.i,a.ids.length);drawHF();
  const steps=[[en,'en',0],[w.tr.replace(/\(.*?\)/g,'').replace(/;/g,','),'tr',0],[en,'en',1]];if(w.ex)steps.push([w.ex,'en',0]);
  let k=0;const run=()=>{if(act!==a||a.paused||a.gen!==g)return;if(k>=steps.length){a.i++;a.to=setTimeout(playHF,900);return}const st=steps[k++];sayQ(st[0],st[1],st[2],run)};
  speechSynthesis.cancel();a.to=setTimeout(run,150);
}
function drawHF(){
  const a=act,w=B[a.ids[a.i]];
  $('#sbody').innerHTML=`<div class="qlabel">Eller serbest dinleme · sadece dinle</div><div class="ctr" style="margin-top:30px"><div class="word">${esc(w.head)}</div><div class="okn">${esc(w.ok)}</div><div class="mean">${esc(w.tr)}</div>${w.ex?`<div class="ex"><p>${esc(w.ex)}</p><p>${esc(w.ext)}</p></div>`:''}</div>`;
  $('#sfoot').innerHTML=`<div class="grid2"><button class="btn sec" onclick="toggleHF()">${a.paused?'▶ Devam et':'⏸ Duraklat'}</button><button class="btn sec" onclick="skipHF()">⏭ Sonraki</button></div>`;
}
function toggleHF(){const a=act;a.paused=!a.paused;a.gen++;clearTimeout(a.to);speechSynthesis.cancel();if(a.paused)drawHF();else playHF()}
function skipHF(){const a=act;a.gen++;clearTimeout(a.to);speechSynthesis.cancel();a.i++;a.paused=false;playHF()}

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!ses&&!act)render()});
save();render();
